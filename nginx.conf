user nginx;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Vite puts a content hash in every file name under /assets, so they never change.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Revalidated on every load, so a new release is picked up straight away.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ =404;
        }
    }
}
